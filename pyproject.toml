[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.ruff]
fix = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]

line-length = 80

[tool.ruff.lint]
select = ["E", "F", "B"]
#select = ["E", "F", "I", "PL", "I", "B"]
ignore = ["B008"]
ignore-init-module-imports = true
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405", "E501"]
"consts.py" = ["E501"]
"tests/*.py" = ["E501"]
"TextSpitter/guide/*.py" = ["E501"]

[tool.black]
line-length = 80
target-version = ['py310', 'py311', 'py312']
extend-exclude = '''
/(
  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
  | profiling
)/
'''

[tool.isort]
profile = "black"
line_length = 80

[project]
name = "textspitter"
version = "2.0.0b1"
authors = [
  { name="Francis Secada", email="francis.secada@gmail.com" },
]
description = "A text-extraction application that facilitates string consumption."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Capped below 2: PyMuPDF 2.x adds numpy, onnxruntime, networkx, psutil,
    # pyyaml, tabulate, pymupdf-layout and pymupdf4llm as hard dependencies and
    # drops musllinux/win32/macOS-x86_64 wheels; TextSpitter only uses
    # pymupdf.open(...) and page text extraction. Owner decision to lift.
    "pymupdf>=1.28.2,<2",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
logging = ["loguru>=0.8.0"]

[project.scripts]
textspitter = "TextSpitter.cli:main"

[project.urls]
Homepage = "https://github.com/fsecada01/TextSpitter"
Issues = "https://github.com/fsecada01/TextSpitter/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "TextSpitter._core"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "build>=1.6.1",
    "cryptography>=50.0.2",
    "isort>=9.0.2",
    "jupyterlab>=4.6.6",
    "jupyterlab-code-formatter>=3.1.0",
    "loguru>=0.8.0",
    "pdoc>=16.0.0",
    "prek>=0.5.11",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-lazy-fixtures>=1.4.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
    "twine>=7.0.0",
    "maturin>=1.16.0",
    "tiktoken>=0.14.0",
]
